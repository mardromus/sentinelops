apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      hostNetwork: true
      containers:
        - name: shop
          image: vulnerable-shop:latest
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
