        h('h3', { text: 'Triage' }),
        h('p', null, 'Risk ', h('b', { text: String(f.risk == null ? '-' : f.risk) }), ' · ', f.priority || '', ' · confidence ', f.confidence, ' · ', f.scanner),
        f.verdict ? h('p', null, h('b', { text: 'Agent: ' + f.verdict.status.replace(/_/g, ' ') + ' (' + f.verdict.confidence + ')' }), ' — ' + f.verdict.rationale, f.verdict.guardrail ? h('div', { class: 'warn', text: f.verdict.guardrail }) : null) : null,
        (f.triageNotes || []).length ? h('ul', { class: 'notes' }, f.triageNotes.map(function (n) { return h('li', { text: n }); })) : null,
        f.suppressed ? h('p', { class: 'pill', text: 'suppressed: ' + (f.suppressReason || '') }) : null,
        !f.fix && f.remediation ? h('div', null, h('h3', { text: 'How to fix', style: 'margin-top:10px' }), h('p', { text: f.remediation })) : null),
      f.fix ? h('div', { class: 'full' }, h('h3', null, 'Proposed fix · ' + f.fix.strategy + ' · ', h('span', { class: 'pill ' + (f.fix.verified ? 'ok' : 'bad'), text: f.fix.verified ? 'verified' : 'unverified' })),
        h('p', { text: f.fix.description }), h('p', { class: 'meta', text: f.fix.verification || '' }), diffPre(f.fix.diff)) : null,
      (f.references || []).length ? h('div', { class: 'full' }, h('h3', { text: 'References' }), h('p', null, f.references.slice(0, 5).map(function (r, i) { return [i ? ' · ' : '', /^https?:\/\//.test(r) ? h('a', { href: r, target: '_blank', rel: 'noopener noreferrer', text: r.replace(/^https?:\/\//, '').slice(0, 70) }) : r]; }))) : null);
  }

  function table() {
    var rows = visible();
    var tbody = h('tbody');
    rows.forEach(function (f) {
      var tr = h('tr', { class: 'row' + (f.suppressed ? ' sup' : ''), tabindex: '0', 'aria-expanded': state.open[f.id] ? 'true' : 'false' },
        h('td', null, sevLabel(f.severity)),
        h('td', { class: 'mono nowrap', text: f.id }),
        h('td', null, h('span', { class: 'pill', text: f.priority || '-' })),
        h('td', { class: 'num', text: f.risk == null ? '-' : f.risk }),
        h('td', null, h('div', { text: f.title }), h('div', { class: 'meta mono', text: f.ruleId })),
        h('td', { class: 'loc mono', text: f.location.file + ':' + f.location.line }),
        h('td', { text: f.category }),
        h('td', null, f.fix ? h('span', { class: 'pill ' + (f.fix.verified ? 'ok' : 'bad'), text: f.fix.verified ? '✓ fix' : 'fix?' }) : null));
      var toggle = function () { state.open[f.id] = !state.open[f.id]; renderTable(); };
      tr.addEventListener('click', toggle);
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
      add(tbody, tr);
      if (state.open[f.id]) add(tbody, h('tr', { class: 'detail' }, h('td', { colspan: '8' }, detail(f))));
    });
    return h('div', { class: 'tbl' }, rows.length ? h('table', null,
      h('thead', null, h('tr', null, ['Severity', 'Id', 'Priority', 'Risk', 'Finding', 'Location', 'Category', 'Fix'].map(function (t, i) { return h('th', { text: t, style: i === 3 ? 'text-align:right' : undefined }); }))),
      tbody) : h('div', { class: 'empty', text: 'No findings match these filters.' }));
  }

  function filters() {
    var cats = ['sast', 'secret', 'dependency', 'config'];
    return h('div', { class: 'filters', role: 'group', 'aria-label': 'Filter findings' },
      SEV.map(function (s) {
        return h('button', { class: 'chip', 'aria-pressed': state.sev[s] ? 'true' : 'false', onclick: function () { state.sev[s] = !state.sev[s]; renderAll(); } }, h('span', { class: 'dot', style: 'background:' + sevVar(s) }), s);
      }),
      h('select', { 'aria-label': 'Category', onchange: function (e) { state.cat = e.target.value; renderTable(); } },
        [h('option', { value: '', text: 'All categories' })].concat(cats.map(function (c) { return h('option', { value: c, selected: state.cat === c, text: c }); }))),
      h('label', { class: 'count' }, h('input', { type: 'checkbox', checked: state.fixOnly, onchange: function (e) { state.fixOnly = e.target.checked; renderTable(); } }), ' verified fix'),
      h('label', { class: 'count' }, h('input', { type: 'checkbox', checked: state.showSuppressed, onchange: function (e) { state.showSuppressed = e.target.checked; renderTable(); } }), ' suppressed'),
      h('span', { class: 'spacer' }),
      h('input', { type: 'search', placeholder: 'Search id, rule, file, CWE…', value: state.q, 'aria-label': 'Search findings', oninput: function (e) { state.q = e.target.value; renderTable(); } }),
      h('span', { class: 'count', id: 'count' }));
  }

  function scanners() {
    return h('section', { class: 'card', style: 'margin-top:16px' }, h('h2', { text: 'Scanners' }),
      h('table', { class: 'scanners' }, h('thead', null, h('tr', null, ['Scanner', 'Status', 'Findings', 'Time', 'Detail'].map(function (t) { return h('th', { text: t }); }))),
        h('tbody', null, D.scan.scanners.map(function (s) {
          return h('tr', null, h('td', { class: 'mono', text: s.name }), h('td', null, h('span', { class: 'pill ' + (s.status === 'ok' ? 'ok' : s.status === 'error' ? 'bad' : ''), text: s.status })),
            h('td', { class: 'num', text: s.findings }), h('td', { class: 'num', text: s.durationMs + ' ms' }), h('td', { class: 'meta', text: s.detail || '' }));
        }))));
  }

  // ---------- wiring ----------
  var tableHost;
  function renderTable() {
    var n = visible().length;
    var c = document.getElementById('count'); if (c) c.textContent = n + ' of ' + D.findings.length;
    var t = table(); tableHost.replaceWith(t); tableHost = t;
  }
  function renderAll() {
    var app = document.getElementById('app'); app.textContent = '';
    tableHost = h('div');
    add(app, [header(), overview(), briefing(), h('section', { class: 'grid g-two' }, heatmap(), filesChart()), filters(), tableHost, scanners(),
      h('footer', null, h('span', { text: 'Generated by SentinelOps ' + D.version + ' at ' + fmtDate(D.generatedAt) + '. Self-contained: this file makes no network requests.' }),
        h('span', { text: 'Severity colours are always paired with labels; every chart value is also in the table.' }))]);
    renderTable();
  }
  function toggleTheme() { document.documentElement.setAttribute('data-theme', theme() === 'dark' ? 'light' : 'dark'); renderAll(); }
  function download() {
    var blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sentinelops-' + D.scan.id.slice(0, 8) + '.json'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (!document.documentElement.getAttribute('data-theme')) renderAll(); });
  renderAll();
})();
</script>
</body>
